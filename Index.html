<body>
<div id="app"></div>

<script>
/* =======================================================================
   UNDIAN JALAN SANTAI HUT RI KE-81 — MAN BALIKPAPAN
   Single-file app. Routing via location.hash. Shared persistent storage
   via window.storage so phones (peserta), admin, and layar TV all sync.
   ======================================================================= */

const ADMIN_PASSWORD = "MAN81BPP2026"; // admin utama — akses penuh, ganti sesuai kebutuhan
const SUBADMIN_PASSWORD = "SUBPANITIA81"; // sub-admin — lihat peserta, kelola kategori, jalankan undian (tanpa reset data)

const DEFAULT_KATEGORI = [
  { id:"k1", tipe:"Utama",   nama:"Hadiah Utama",   hadiah:"Sepeda Gunung", jumlah:1 },
  { id:"k2", tipe:"Hiburan", nama:"Hadiah Hiburan 1", hadiah:"Kipas Angin",   jumlah:3 },
  { id:"k3", tipe:"Hiburan", nama:"Hadiah Hiburan 2", hadiah:"Payung Cantik", jumlah:5 }
];


/* ---------------- Firebase / Firestore setup ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyCpjhd0i18M8NaEc0ADwu7VdQpzteCKaw8",
  authDomain: "undian-jalan-santai-81.firebaseapp.com",
  projectId: "undian-jalan-santai-81",
  storageBucket: "undian-jalan-santai-81.firebasestorage.app",
  messagingSenderId: "106542622145",
  appId: "1:106542622145:web:c1db0aa2c5a992491ffb40",
  measurementId: "G-XDPS4P6JEL"
};

let db = null;
let firestoreError = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(e){
  firestoreError = e;
  console.error("Gagal inisialisasi Firestore:", e);
}

const colPeserta  = () => db.collection("peserta");
const colKategori = () => db.collection("kategori");
const colHasil    = () => db.collection("hasil");
const docStatus   = () => db.collection("status").doc("current");
const docCounter  = () => db.collection("counters").doc("peserta");
const docPengaturan = () => db.collection("pengaturan").doc("current");

const DEFAULT_PENGATURAN = { waktuMulai:"", tutupOtomatis:false, prefix:"JS81-", nomorMulai:1, modePenomoran:"otomatis" };

async function getPengaturan(){
  try{
    const snap = await docPengaturan().get();
    return snap.exists ? { ...DEFAULT_PENGATURAN, ...snap.data() } : { ...DEFAULT_PENGATURAN };
  }catch(e){ console.error("getPengaturan gagal", e); return { ...DEFAULT_PENGATURAN }; }
}
async function savePengaturan(v){ await docPengaturan().set(v); }

function pendaftaranSudahTutup(pengaturan){
  if(!pengaturan.tutupOtomatis || !pengaturan.waktuMulai) return false;
  const waktuMulaiMs = new Date(pengaturan.waktuMulai).getTime();
  if(isNaN(waktuMulaiMs)) return false;
  return Date.now() >= waktuMulaiMs;
}

/* ---------------- data helpers (Firestore-backed) ---------------- */
async function getPeserta(){
  try{
    const snap = await colPeserta().orderBy("ts").get();
    return snap.docs.map(d => ({ id:d.id, ...d.data() }));
  }catch(e){ console.error("getPeserta gagal", e); return []; }
}

async function tambahPeserta({ nama, kategoriPeserta, kelas }){
  const pengaturan = await getPengaturan();
  const prefix = pengaturan.prefix || "JS81-";
  const mulaiDari = Math.max(1, parseInt(pengaturan.nomorMulai, 10) || 1);
  return db.runTransaction(async (tx) => {
    const counterRef = docCounter();
    const counterSnap = await tx.get(counterRef);
    const current = counterSnap.exists ? counterSnap.data().value : (mulaiDari - 1);
    const next = current + 1;
    const nomor = prefix + pad4(next);
    tx.set(counterRef, { value: next });
    tx.set(colPeserta().doc(), { nomor, nama, kategoriPeserta, kelas, ts: Date.now() });
    return nomor;
  });
}

/* Mode "peserta input nomor kupon sendiri" — nomor tiket berasal dari kupon
   fisik yang sudah dibagikan panitia lebih dulu, bukan dibuat otomatis. */
async function daftarDenganNomorKupon({ nama, kategoriPeserta, kelas, nomor }){
  const nomorNormal = nomor.trim();
  const existing = await colPeserta().where("nomor", "==", nomorNormal).get();
  if(!existing.empty){
    const err = new Error("Nomor kupon sudah dipakai");
    err.code = "NOMOR_SUDAH_DIPAKAI";
    throw err;
  }
  await colPeserta().add({ nomor: nomorNormal, nama, kategoriPeserta, kelas, ts: Date.now() });
  return nomorNormal;
}

async function hapusSemuaPeserta(){
  const snap = await colPeserta().get();
  const batch = db.batch();
  snap.docs.forEach(d => batch.delete(d.ref));
  batch.delete(docCounter());
  await batch.commit();
}

async function ensureKategoriSeeded(){
  const snap = await colKategori().get();
  if(snap.empty){
    const batch = db.batch();
    DEFAULT_KATEGORI.forEach(k => batch.set(colKategori().doc(k.id), { tipe:k.tipe, nama:k.nama, hadiah:k.hadiah, jumlah:k.jumlah }));
    await batch.commit();
  }
}

async function getKategori(){
  try{
    await ensureKategoriSeeded();
    const snap = await colKategori().get();
    const list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    list.sort((a,b)=> a.id.localeCompare(b.id));
    return list;
  }catch(e){ console.error("getKategori gagal", e); return DEFAULT_KATEGORI; }
}

async function saveKategori(list){
  const batch = db.batch();
  list.forEach(k => {
    const { id, ...data } = k;
    batch.set(colKategori().doc(id), data);
  });
  await batch.commit();
}

async function getHasil(){
  try{
    const snap = await colHasil().get();
    const out = {};
    snap.docs.forEach(d => out[d.id] = (d.data().pemenang || []));
    return out;
  }catch(e){ console.error("getHasil gagal", e); return {}; }
}

async function saveHasil(hasilObj){
  const kats = await getKategori();
  const batch = db.batch();
  kats.forEach(k => {
    const ref = colHasil().doc(k.id);
    if(hasilObj[k.id] && hasilObj[k.id].length){
      batch.set(ref, { pemenang: hasilObj[k.id] });
    } else {
      batch.delete(ref);
    }
  });
  await batch.commit();
}

async function getStatus(){
  try{
    const snap = await docStatus().get();
    return snap.exists ? snap.data() : { kategoriId:null, status:"idle", mulai:0, durasi:4200, tampil:9000 };
  }catch(e){ console.error("getStatus gagal", e); return { kategoriId:null, status:"idle", mulai:0, durasi:4200, tampil:9000 }; }
}
async function saveStatus(v){ await docStatus().set(v); }

function pad4(n){ return String(n).padStart(4,"0"); }

/* Nomor tiket peserta disimpan di HP masing-masing (localStorage) supaya
   halaman Cek Nomor bisa otomatis, tanpa perlu ketik ulang manual.        */
const LOCAL_KEY_NOMOR = "jsm81_nomor_saya";
function simpanNomorSaya(nomor){
  try{ localStorage.setItem(LOCAL_KEY_NOMOR, nomor); }catch(e){}
}

const app = document.getElementById("app");
const routes = {
  "": renderHome, "#": renderHome, "#/": renderHome,
  "#daftar": renderDaftar,
  "#cek": renderCek,
  "#admin": renderAdmin,
  "#layar": renderLayar
};

function topbar(active, simple){
  const links = simple
    ? [["#","Beranda"],["#daftar","Daftar Peserta"],["#cek","Cek Nomor"]]
    : [["#","Beranda"],["#daftar","Daftar Peserta"],["#cek","Cek Nomor"],["#layar","Layar Undian"],["#admin","Admin"]];
  return `
  <div class="topbar">
    <div class="brand">
      <div class="logo">${LOGO_MAN}</div>
      <div class="brand-text">
        <b>Jalan Santai HUT RI ke-81</b>
        <span>MAN Balikpapan &middot; Kemenag RI</span>
      </div>
    </div>
    <div class="nav-links">
      ${links.map(([h,t])=>`<a href="${h}" class="${ (location.hash||"#")===h || (h==='#'&&!location.hash) ?'active':''}">${t}</a>`).join("")}
    </div>
  </div>
  <div class="bunting"></div>`;
}

function shell(active, bodyHtml, opts={}){
  app.innerHTML = `
    ${topbar(active, opts.simple)}
    ${bodyHtml}
    ${opts.noFooter?"":`<footer class="foot">Panitia Jalan Santai &middot; HUT Kemerdekaan Republik Indonesia ke-81 &middot; 17 Agustus 2026 &middot; MAN Balikpapan
      ${opts.simple?` &middot; <a href="#" style="text-decoration:underline;">Panitia</a>`:""}
    </footer>`}
  `;
}

function route(){
  const fn = routes[location.hash] || renderHome;
  fn();
}
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);

            <input type="text" id="f-nama" placeholder="Contoh: Ahmad Fikri" required>
          </div>

function renderCek(){
  const nomorTersimpan = getNomorSayaTersimpan();

  shell("#cek", `
    <div class="wrap" style="max-width:560px;">
      <div class="eyebrow">Cek Hasil Undian</div>
      <h2 style="margin:0 0 4px;color:var(--merah-gelap);">Apakah Anda Beruntung?</h2>
      <p style="color:var(--abu);margin:0 0 22px;" id="cek-sub">${nomorTersimpan ? "Nomor tiket Anda otomatis dikenali dari HP ini." : "Masukkan nomor tiket Anda sendiri (contoh: JS81-0007)."}</p>
      <div class="card" id="cek-form-card" style="${nomorTersimpan?'display:none;':''}">
        <form id="form-cek" style="display:flex;gap:10px;flex-wrap:wrap;">
          <input type="text" id="f-cari" placeholder="Contoh: JS81-0007" style="flex:1;min-width:200px;padding:12px 14px;border-radius:10px;border:1.5px solid #e7d8c4;font-size:15px;">
          <button class="btn" type="submit">Cek</button>
        </form>
        <p style="margin:10px 0 0;font-size:12px;color:var(--abu);">Untuk menjaga privasi peserta lain, pencarian di sini hanya bisa memakai nomor tiket, bukan nama.</p>
      </div>
      <div id="cek-hasil" style="margin-top:20px;"></div>
      <p style="text-align:center;margin-top:14px;">
        <a href="#" id="link-cek-lain" style="font-size:12.5px;color:var(--abu);text-decoration:underline;${nomorTersimpan?'':'display:none;'}">Bukan nomor Anda? Cek nomor lain</a>
      </p>
    </div>
  `, { simple:true });

  async function cariDanTampilkan(nomorInput){
    const q = nomorInput.trim().toLowerCase();
    const out = document.getElementById("cek-hasil");
    if(!q){ out.innerHTML=""; return; }
    out.innerHTML = `<p style="text-align:center;color:var(--abu);">Mencari...</p>`;

    const [peserta, hasil, kategori] = await Promise.all([getPeserta(), getHasil(), getKategori()]);
    const match = peserta.find(p => p.nomor.toLowerCase() === q);

    if(!match){
      out.innerHTML = `
        <div class="result-box no">
          <div class="big-icon">❓</div>
          <h2>Nomor Tidak Ditemukan</h2>
          <p>Pastikan nomor tiket dituliskan dengan benar, contoh: JS81-0007.</p>
        </div>`;
      return;
    }
    tampilkanHasil(match.nomor, peserta, hasil, kategori, out);
  }

  document.getElementById("form-cek").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const nomor = document.getElementById("f-cari").value;
    await cariDanTampilkan(nomor);
    if(nomor.trim()) simpanNomorSaya(nomor.trim().toUpperCase());
  });

  document.getElementById("link-cek-lain").addEventListener("click", (e)=>{
    e.preventDefault();
    hapusNomorSayaTersimpan();
    document.getElementById("cek-form-card").style.display = "";
    document.getElementById("link-cek-lain").style.display = "none";
    document.getElementById("cek-sub").textContent = "Masukkan nomor tiket Anda sendiri (contoh: JS81-0007).";
    document.getElementById("cek-hasil").innerHTML = "";
    document.getElementById("f-cari").value = "";
    document.getElementById("f-cari").focus();
  });

  if(nomorTersimpan) cariDanTampilkan(nomorTersimpan);
}


function tampilkanHasil(nomor, peserta, hasil, kategori, out){
  const p = peserta.find(x=>x.nomor===nomor);
  if(!p) return;
  const menang = [];
  for(const kat of kategori){
    const pemenang = hasil[kat.id] || [];
    if(pemenang.some(w=>w.nomor===nomor)) menang.push(kat);
  }
  const sudahAdaUndian = Object.keys(hasil).some(k => (hasil[k]||[]).length>0);

  if(menang.length>0){
    out.innerHTML = `
      <div class="result-box ok">
        <div class="big-icon">🎉</div>
        <h2>Anda Berhasil!</h2>
        <p style="margin:0 0 14px;">Selamat, <b>${escapeHtml(p.nama)}</b> (${escapeHtml(p.nomor)})</p>
        ${menang.map(k=>`<div class="badge" style="background:rgba(255,255,255,.18);color:#fff;margin:3px;">${escapeHtml(k.nama)} — ${escapeHtml(k.hadiah)}</div>`).join("")}
        <p style="margin-top:16px;font-size:13px;opacity:.9;">Silakan tunjukkan halaman ini ke panitia untuk pengambilan hadiah.</p>
      </div>`;
  } else {
    out.innerHTML = `
      <div class="result-box no">
        <div class="big-icon">🙏</div>
        <h2>Anda Belum Berhasil</h2>
        <p style="margin:0;">Nomor <b>${escapeHtml(p.nomor)}</b> atas nama ${escapeHtml(p.nama)} belum menjadi pemenang${sudahAdaUndian?" pada undian yang sudah berjalan":""}.</p>
        <p style="margin-top:10px;color:var(--abu);font-size:13px;">${sudahAdaUndian? "Tetap pantau, mungkin masih ada kategori hadiah yang belum diundi.":"Undian belum dimulai. Pantau layar undian ya!"}</p>
      </div>`;
  }
}

          <button class="btn gold small" id="btn-rekap-tv" ${totalPemenang===0?'disabled title="Belum ada pemenang"':''}>Tampilkan Rekap Pemenang di TV</button>
          ${sedangRekap?`<button class="btn outline small" id="btn-tutup-rekap">Kembali ke Layar Normal</button>`:""}
        </div>
      </div>

      <div class="section-title"><h2>Kelola &amp; Jalankan Undian per Kategori</h2></div>
      <div id="kategori-list"></div>
      <div style="margin:14px 0 6px;">
        <button class="btn gold small" id="btn-tambah-kategori">+ Tambah Kategori Hadiah</button>
      </div>

      <div class="section-title"><h2>Daftar Peserta Terdaftar</h2>
        <input type="text" id="cari-peserta" placeholder="Cari nama / nomor / kelas..." style="padding:9px 12px;border-radius:8px;border:1.5px solid #e7d8c4;font-size:13px;">
      </div>
      <div class="card" style="overflow:auto;max-height:420px;">
        <table>
          <thead><tr><th>Nomor</th><th>Nama</th><th>Kategori</th><th>Kelas</th><th>Waktu Daftar</th></tr></thead>
          <tbody id="tbody-peserta"></tbody>
        </table>
      </div>

      ${isFull ? `
      <div class="section-title"><h2 style="color:#8a1f1f;">Zona Berbahaya</h2></div>
      <div class="card" style="border:1.5px dashed #c94848;">
        <p style="margin:0 0 12px;font-size:13.5px;color:var(--abu);">Menghapus seluruh data peserta, hasil undian, dan status undian. Tidak dapat dibatalkan.</p>
        <button class="btn danger" id="btn-reset-all">Reset Semua Data</button>
      </div>` : ""}
    </div>
  `);

  document.getElementById("btn-logout").addEventListener("click", ()=>{ adminRole=null; renderAdmin(); });

  document.getElementById("btn-rekap-tv").addEventListener("click", async ()=>{
    await saveStatus({ kategoriId:null, namaKategori:null, hadiah:null, status:"rekap", mulai:Date.now(), durasi:0, tampil:0 });
    renderAdminDashboard();
  });
  const btnTutupRekap = document.getElementById("btn-tutup-rekap");
  if(btnTutupRekap){
    btnTutupRekap.addEventListener("click", async ()=>{
      await saveStatus({ kategoriId:null, status:"idle", mulai:0, durasi:4200, tampil:9000 });
      renderAdminDashboard();
    });
  }

  const btnSimpanPengaturan = document.getElementById("btn-simpan-pengaturan");
  if(btnSimpanPengaturan){
    const selectMode = document.getElementById("set-mode-penomoran");
    selectMode.addEventListener("change", ()=>{
      const manual = selectMode.value === "manual";
      document.getElementById("wrap-mode-otomatis").style.display = manual ? "none" : "block";
      document.getElementById("wrap-mode-manual").style.display = manual ? "block" : "none";
    });
    btnSimpanPengaturan.addEventListener("click", async ()=>{
      const modePenomoran = selectMode.value;
      const waktuMulai = document.getElementById("set-waktu-mulai").value;
      const prefix = document.getElementById("set-prefix").value.trim() || "JS81-";
      const nomorMulai = Math.max(1, parseInt(document.getElementById("set-nomor-mulai").value,10) || 1);
      const tutupOtomatis = document.getElementById("set-tutup-otomatis").checked;
      await savePengaturan({ waktuMulai, prefix, nomorMulai, tutupOtomatis, modePenomoran });
      renderAdminDashboard();
    });
  }

  // kategori rows
  const katWrap = document.getElementById("kategori-list");
  katWrap.innerHTML = kategori.map(k=>{
    const menang = hasil[k.id] || [];
    const sudah = menang.length>0;
    return `
    <div class="kat-row" data-id="${k.id}">
      <div class="kat-head">
        <div class="kat-name">${escapeHtml(k.nama)} <span class="badge ${k.tipe==='Utama'?'utama':'hiburan'}">${escapeHtml(k.tipe)}</span> <span class="badge ${sudah?'done':'pending'}">${sudah?'Sudah diundi':'Belum diundi'}</span></div>
      </div>
      <div class="kat-fields">
        <div class="field" style="margin:0;"><label>Nama Kategori</label><input type="text" class="in-nama" value="${escapeHtml(k.nama)}"></div>
        <div class="field" style="margin:0;"><label>Nama Hadiah</label><input type="text" class="in-hadiah" value="${escapeHtml(k.hadiah)}"></div>
        <div class="field" style="margin:0;"><label>Jumlah Pemenang</label><input type="number" min="1" class="in-jumlah" value="${k.jumlah}"></div>
      </div>
      <div class="kat-actions">
        <button class="btn ghost small btn-simpan">Simpan Perubahan</button>
        <button class="btn small btn-undi ${sudah?'ghost':''}" ${sudah?'disabled':''}>Undi Kategori Ini 🎲</button>
        ${sudah?`<button class="btn outline small btn-ulang">Undi Ulang</button>`:""}
        ${isFull?`<button class="btn ghost small btn-hapus-kat" style="color:#8a1f1f;">Hapus Kategori</button>`:""}
      </div>
      ${sudah?`<div style="font-size:13px;color:var(--abu);">Pemenang: ${menang.map(m=>`${escapeHtml(m.nomor)} (${escapeHtml(m.nama)})`).join(", ")}</div>`:""}
    </div>`;
  }).join("") || `<p style="color:var(--abu);font-size:13.5px;">Belum ada kategori hadiah.</p>`;

  katWrap.querySelectorAll(".kat-row").forEach(row=>{
    const id = row.dataset.id;
    row.querySelector(".btn-simpan").addEventListener("click", async ()=>{
      const nama = row.querySelector(".in-nama").value.trim();
      const hadiah = row.querySelector(".in-hadiah").value.trim();
      const jumlah = Math.max(1, parseInt(row.querySelector(".in-jumlah").value||"1",10));
      const kat = (await getKategori()).map(k => k.id===id ? {...k, nama, hadiah, jumlah} : k);
      await saveKategori(kat);
      renderAdminDashboard();
    });
    row.querySelectorAll("button").forEach(b=>{
      if(b.textContent.includes("Undi Kategori")) b.addEventListener("click", ()=> jalankanUndian(id));
      if(b.textContent.includes("Undi Ulang")) b.addEventListener("click", ()=> undiUlang(id));
      if(b.classList.contains("btn-hapus-kat")) b.addEventListener("click", ()=> hapusKategori(id));
    });
  });

  document.getElementById("btn-tambah-kategori").addEventListener("click", async ()=>{
    await tambahKategoriBaru();
    renderAdminDashboard();
  });

  // peserta table
  function drawPeserta(list){
    document.getElementById("tbody-peserta").innerHTML = list.slice().reverse().map(p=>`
      <tr><td class="mono">${escapeHtml(p.nomor)}</td><td>${escapeHtml(p.nama)}</td><td>${escapeHtml(p.kategoriPeserta||"-")}</td><td>${escapeHtml(p.kelas)}</td><td>${fmtTime(p.ts)}</td></tr>
    `).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--abu);">Belum ada peserta terdaftar.</td></tr>`;
  }
  drawPeserta(peserta);
  document.getElementById("cari-peserta").addEventListener("input", (e)=>{
    const q = e.target.value.trim().toLowerCase();
    drawPeserta(peserta.filter(p => [p.nomor,p.nama,p.kelas].join(" ").toLowerCase().includes(q)));
  });

  if(isFull){
    document.getElementById("btn-reset-all").addEventListener("click", async ()=>{
      if(!confirm("Yakin ingin menghapus SEMUA data peserta dan hasil undian? Tindakan ini tidak bisa dibatalkan.")) return;
      if(!confirm("Konfirmasi sekali lagi: hapus semua data sekarang?")) return;
      await hapusSemuaPeserta();
      await saveKategori(DEFAULT_KATEGORI);
      await saveHasil({});
      await saveStatus({ kategoriId:null, status:"idle", mulai:0, durasi:4200, tampil:9000 });
      renderAdminDashboard();
    });
  }
}

async function tambahKategoriBaru(){
  const existing = await getKategori();
  let maxNum = 0;
  existing.forEach(k => { const m = /^k(\d+)$/.exec(k.id); if(m) maxNum = Math.max(maxNum, parseInt(m[1],10)); });
  const newId = "k" + (maxNum + 1);
  await colKategori().doc(newId).set({ tipe:"Hiburan", nama:"Hadiah Baru "+(maxNum+1), hadiah:"", jumlah:1 });
  return newId;
}

async function hapusKategori(kategoriId){
  const hasil = await getHasil();
  if((hasil[kategoriId]||[]).length>0){
    if(!confirm("Kategori ini sudah punya pemenang. Menghapusnya juga akan menghapus data pemenang tersebut. Lanjutkan?")) return;
  } else {
    if(!confirm("Hapus kategori hadiah ini?")) return;
  }
  await colKategori().doc(kategoriId).delete();
  await colHasil().doc(kategoriId).delete().catch(()=>{});
  renderAdminDashboard();
}

async function jalankanUndian(kategoriId){
  const [peserta, kategori, hasil] = await Promise.all([getPeserta(), getKategori(), getHasil()]);
  const kat = kategori.find(k=>k.id===kategoriId);
  if(!kat) return;
  if((hasil[kategoriId]||[]).length>0){ alert("Kategori ini sudah diundi."); return; }

  const sudahMenang = new Set(Object.values(hasil).flat().map(w=>w.nomor));
  const kandidat = peserta.filter(p => !sudahMenang.has(p.nomor));
  if(kandidat.length===0){ alert("Tidak ada peserta yang memenuhi syarat untuk diundi."); return; }

  const shuffled = kandidat.slice().sort(()=>Math.random()-0.5);
  const pemenang = shuffled.slice(0, Math.min(kat.jumlah, shuffled.length)).map(p=>({nomor:p.nomor, nama:p.nama, kelas:p.kelas}));

  hasil[kategoriId] = pemenang;
  await saveHasil(hasil);
  await saveStatus({ kategoriId, namaKategori:kat.nama, hadiah:kat.hadiah, status:"acak", mulai:Date.now(), durasi:4200, tampil:9000 });
  renderAdminDashboard();
}

async function undiUlang(kategoriId){
  if(!confirm("Undi ulang kategori ini? Pemenang sebelumnya akan dihapus dan diundi kembali.")) return;
  const hasil = await getHasil();
  delete hasil[kategoriId];
  await saveHasil(hasil);
  renderAdminDashboard();
  setTimeout(()=>jalankanUndian(kategoriId), 150);
}

/* ================= LAYAR TV ================= */
let layarInterval = null;
let spinInterval = null;

function renderLayar(){
  shell("#layar", `
    <div class="wrap" style="max-width:1560px;">
      <div class="tv-wrap" id="tv">
        <div class="tv-81">81</div>
        <div class="tv-bunting bunting" style="opacity:.5;"></div>
        <div class="tv-header">
          <div class="tv-logo">${LOGO_MAN}</div>
          <div class="tv-title">
            <h1>HUT KEMERDEKAAN RI KE-81</h1>
            <p>Undian Doorprize Jalan Santai &middot; MAN Balikpapan &middot; Kemenag RI</p>
          </div>
          <div class="tv-logo">${LOGO_KEMENAG}</div>
        </div>
        <div class="tv-stage" id="tv-stage"></div>
        <div class="tv-ticker"><span id="tv-ticker-text">Memuat data undian...</span></div>
      </div>
    </div>
  `, {noFooter:true});

  lastRenderedState = null; // paksa render ulang setiap kali halaman Layar TV dibuka
  clearInterval(layarInterval);
  clearInterval(spinInterval);
  tickLayar();
  layarInterval = setInterval(tickLayar, 1200);
}

let lastRenderedState = null;
async function tickLayar(){
  if(location.hash !== "#layar"){ clearInterval(layarInterval); clearInterval(spinInterval); return; }
  const [peserta, kategori, hasil, status] = await Promise.all([getPeserta(), getKategori(), getHasil(), getStatus()]);
  const stage = document.getElementById("tv-stage");
  if(!stage) return;

  const now = Date.now();
  const elapsed = now - (status.mulai||0);
  const modeRekap = status.status === "rekap";
  const sedangAcak = !modeRekap && status.status==="acak" && status.kategoriId && elapsed < (status.durasi||4200);
  const barusanSelesai = !modeRekap && status.status==="acak" && status.kategoriId && elapsed >= (status.durasi||4200) && elapsed < (status.durasi||4200)+(status.tampil||9000);

  let stateKey;
  if(modeRekap){
    const totalMenang = Object.values(hasil).reduce((a,b)=>a+(b?b.length:0),0);
    stateKey = "rekap:"+kategori.length+":"+totalMenang;
  }
  else if(sedangAcak) stateKey = "acak:"+status.kategoriId+":"+status.mulai;
  else if(barusanSelesai) stateKey = "hasil:"+status.kategoriId+":"+status.mulai;
  else stateKey = "idle";

  if(stateKey !== lastRenderedState){
    lastRenderedState = stateKey;
    clearInterval(spinInterval);

    if(modeRekap){
      const kategoriDenganPemenang = kategori.filter(k => (hasil[k.id]||[]).length>0);
      stage.innerHTML = `
        <div class="tv-kategori-tag">🏆 Rekap Semua Pemenang</div>
        <div id="rekap-grid" style="width:100%;max-height:100%;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:4px 6px;"></div>
      `;
      const grid = document.getElementById("rekap-grid");
      if(kategoriDenganPemenang.length===0){
        grid.innerHTML = `<div class="tv-meta" style="grid-column:1/-1;text-align:center;">Belum ada pemenang.</div>`;
      } else {
        kategoriDenganPemenang.forEach(k=>{
          const box = document.createElement("div");
          box.style.cssText = "background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;";
          box.innerHTML = `
            <div style="font-size:clamp(11px,1.3vw,15px);font-weight:800;color:var(--emas-terang);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">${escapeHtml(k.nama)}${k.hadiah?" — "+escapeHtml(k.hadiah):""}</div>
            ${(hasil[k.id]||[]).map(w=>`
              <div style="display:flex;justify-content:space-between;gap:8px;font-size:clamp(11px,1.4vw,15px);padding:3px 0;border-top:1px solid rgba(255,255,255,.08);">
                <span class="mono" style="color:var(--emas-terang);">${escapeHtml(w.nomor)}</span>
                <span style="flex:1;text-align:left;padding-left:8px;">${escapeHtml(w.nama)}</span>
                <span style="opacity:.7;">${escapeHtml(w.kelas||"")}</span>
              </div>`).join("")}
          `;
          grid.appendChild(box);
        });
      }
    } else if(sedangAcak){
      stage.innerHTML = `
        <div class="tv-kategori-tag">Sedang Mengundi: ${escapeHtml(status.namaKategori||"")}</div>
        <div class="tv-nomor spin mono" id="spin-nomor">----</div>
        <div class="tv-meta">Nomor tiket sedang diacak sistem...</div>
      `;
      const pool = peserta.length ? peserta.map(p=>p.nomor) : ["JS81-0001"];
      spinInterval = setInterval(()=>{
        const el = document.getElementById("spin-nomor");
        if(el) el.textContent = pool[Math.floor(Math.random()*pool.length)];
      }, 70);
    } else if(barusanSelesai){
      const pemenang = hasil[status.kategoriId] || [];
      spawnConfetti();
      const banyak = pemenang.length > 3;
      stage.innerHTML = `
        <div class="tv-kategori-tag">🏆 ${escapeHtml(status.namaKategori||"")}${status.hadiah?" — "+escapeHtml(status.hadiah):""}</div>
        <div id="winner-list" style="
          width:100%;max-height:100%;overflow-y:auto;padding:4px 10px;
          display:flex;
          flex-direction:${banyak?'row':'column'};
          flex-wrap:${banyak?'wrap':'nowrap'};
          justify-content:center;
          align-items:${banyak?'stretch':'center'};
          gap:${banyak?'10px':'6px'};
        "></div>
      `;
      const wl = document.getElementById("winner-list");
      pemenang.forEach((w,i)=>{
        const row = document.createElement("div");
        if(banyak){
          row.style.cssText = "background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 16px;min-width:150px;text-align:center;";
          row.innerHTML = `
            <div class="mono" style="font-size:clamp(13px,2vw,22px);color:var(--emas-terang);font-weight:800;">${escapeHtml(w.nomor)}</div>
            <div style="font-size:clamp(11px,1.4vw,15px);font-weight:700;">${escapeHtml(w.nama)}</div>
            <div style="font-size:clamp(9px,1.1vw,12px);opacity:.75;">${escapeHtml(w.kelas||"")}</div>`;
        } else {
          row.style.cssText = "display:flex;flex-direction:column;align-items:center;margin-top:"+(i===0?"0":"6px");
          row.innerHTML = `<div class="tv-nomor mono" style="font-size:clamp(38px,7vw,90px);">${escapeHtml(w.nomor)}</div>
            <div class="tv-nama">${escapeHtml(w.nama)}</div>
            <div class="tv-meta">${escapeHtml(w.kelas||"")}</div>`;
        }
        wl.appendChild(row);
      });
    } else {
      const totalMenang = Object.values(hasil).reduce((a,b)=>a+(b?b.length:0),0);
      stage.innerHTML = `
        <div class="tv-idle-label">Peserta Terdaftar</div>
        <div class="tv-idle-count mono">${peserta.length}</div>
        <div class="tv-idle-label" style="margin-top:14px;">${totalMenang>0? "Menunggu Undian Berikutnya" : "Menunggu Undian Dimulai"}</div>
      `;
    }
  }

  // ticker of winners so far
  const semuaMenang = [];
  for(const k of kategori){
    (hasil[k.id]||[]).forEach(w => semuaMenang.push(`${k.nama}: ${w.nomor} (${w.nama})`));
  }
  const tickerEl = document.getElementById("tv-ticker-text");
  if(tickerEl){
    tickerEl.textContent = semuaMenang.length
      ? "🎉 PEMENANG SEJAUH INI — " + semuaMenang.join("    •    ") + "     "
      : "Selamat datang di layar undian doorprize Jalan Santai HUT RI ke-81 — nomor tiket akan diundi secara acak oleh sistem —";
  }
}

function spawnConfetti(){
  const tv = document.getElementById("tv");
  if(!tv) return;
  const colors = ["#C8102E","#FFFDF8","#D4A017","#7A0C1E"];
  for(let i=0;i<45;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100+"%";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.6+Math.random()*1.6)+"s";
    c.style.animationDelay = (Math.random()*0.6)+"s";
    tv.appendChild(c);
    setTimeout(()=>c.remove(), 4000);
  }
}
